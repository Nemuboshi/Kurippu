name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-13
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Windows libmpv SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'Kurippu-CI' }
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest' `
            -Headers $headers
          $dev = $release.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-*.7z' } | Select-Object -First 1
          $runtime = $release.assets | Where-Object { $_.name -like 'mpv-x86_64-*.7z' } | Select-Object -First 1
          if (-not $dev -or -not $runtime) { throw 'Could not find the Windows libmpv release assets' }
          $root = Join-Path $env:RUNNER_TEMP 'kurippu-libmpv'
          $devDir = Join-Path $root 'dev'
          $runtimeDir = Join-Path $root 'runtime'
          New-Item -ItemType Directory -Force -Path $devDir, $runtimeDir | Out-Null
          $devArchive = Join-Path $root $dev.name
          $runtimeArchive = Join-Path $root $runtime.name
          Invoke-WebRequest -Uri $dev.browser_download_url -OutFile $devArchive
          Invoke-WebRequest -Uri $runtime.browser_download_url -OutFile $runtimeArchive
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw '7-Zip is required to unpack the Windows libmpv SDK' }
          & $sevenZip x $devArchive "-o$devDir" -y
          if ($LASTEXITCODE -ne 0) { throw 'Failed to unpack the Windows libmpv SDK' }
          & $sevenZip x $runtimeArchive "-o$runtimeDir" -y
          if ($LASTEXITCODE -ne 0) { throw 'Failed to unpack the Windows libmpv runtime' }
          $sdk = Join-Path $HOME 'libmpv'
          New-Item -ItemType Directory -Force -Path (Join-Path $sdk 'include'), (Join-Path $sdk 'lib'), (Join-Path $sdk 'bin') | Out-Null
          $mpvInclude = Get-ChildItem -Path $devDir -Recurse -Directory -Filter mpv | Where-Object { Test-Path (Join-Path $_.FullName 'client.h') } | Select-Object -First 1
          if (-not $mpvInclude) { throw 'The libmpv SDK did not contain mpv headers' }
          Copy-Item (Join-Path $mpvInclude.Parent.FullName '*') (Join-Path $sdk 'include') -Recurse -Force
          Get-ChildItem -Path $runtimeDir -Recurse -File -Filter '*.dll' | Copy-Item -Destination (Join-Path $sdk 'bin') -Force
          # Invoke node directly, not `pnpm libmpv:importlib`. pnpm sees no
          # node_modules this early and auto-installs first, which fires the
          # native/mpv gypfile hook -- and that node-gyp build needs the mpv.lib
          # this script exists to produce. The package manager demands the
          # artifact its own pre-step generates.
          node --experimental-strip-types scripts/libmpv-importlib.ts
      - name: Install macOS libmpv
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Install Linux libmpv tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libmpv-dev patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compile and link the Rust addon
        run: cargo test --release --no-run --manifest-path native/mpv/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm fetch-binaries ${{ matrix.target }}
      - run: pnpm build:native
      - run: pnpm package -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: kurippu-${{ matrix.target }}
          path: dist/*
